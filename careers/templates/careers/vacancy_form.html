{% extends 'core/dashboard/dashboard_base.html' %}

{% block content %}
<div class="container py-4">
    <div class="card border-0 shadow-sm p-4">
        <h4 class="mb-4">{{ title }}</h4>
        <form method="post">
            {% csrf_token %}
            <div class="row">
                {% for field in form %}
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                    <div class="text-danger small">{{ field.errors }}</div>
                    {% endif %}
                </div>
                {% endfor %}
            </div>
            <button type="submit" class="btn btn-warning fw-bold px-4">Save Vacancy</button>
            <a href="{% url 'hr_dashboard' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
