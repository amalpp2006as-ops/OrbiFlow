{% extends 'core/base.html' %}
{% load static %}

{% block content %}
<div class="breadcrumb-option spad set-bg" data-setbg="{% static 'core/images/breadcrumb-bg.jpg' %}">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <div class="breadcrumb__text">
                    <h2>Apply: {{ vacancy.title }}</h2>
                    <div class="breadcrumb__links">
                        <a href="{% url 'careers' %}">Careers</a>
                        <a href="{% url 'job_detail' vacancy.pk %}">{{ vacancy.title }}</a>
                        <span>Apply</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<section class="spad">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm p-4">
                    <h4 class="mb-4">Submit Your Application</h4>
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                            <div class="text-danger small mt-1">{{ field.errors }}</div>
                            {% endif %}
                        </div>
                        {% endfor %}
                        <button type="submit" class="btn btn-warning px-4 fw-bold">Submit Application</button>
                        <a href="{% url 'job_detail' vacancy.pk %}" class="btn btn-outline-secondary ms-2">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
