{% extends 'base.html' %}

{% block title %}
Password Reset Complete | OrbiFlow
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow p-4 text-center">

                <h3 class="text-success mb-3">
                    Password Reset Successful!

                <p>
                    Your OrbiFlow password has been changed successfully.

                <a href="/api/accounts/login/"

                    Return to Login

                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
