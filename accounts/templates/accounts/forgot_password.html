<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | OrbiFlow</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Aldrich&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f5f2ed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            padding: 50px 45px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
        }

        .logo {
            font-family: 'Aldrich', sans-serif;
            font-size: 25px;
            color: #22201d;
            margin-bottom: 40px;
        }

        .small-title {
            color: #b58b63;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        h1 {
            color: #22201d;
            font-size: 29px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .description {
            color: #85817b;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #22201d;
            margin-bottom: 9px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #dedbd5;
            border-radius: 5px;
            outline: none;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            margin-bottom: 20px;
        }

        input:focus {
            border-color: #b58b63;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #22201d;
            color: white;
            border: none;
            border-radius: 5px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #b58b63;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 20px;
            font-size: 13px;
            line-height: 1.6;
            text-align: center;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #85817b;
            font-size: 13px;
            text-decoration: none;
        }

        .back-link:hover {
            color: #b58b63;
        }

        @media (max-width: 500px) {
            .container {
                padding: 35px 25px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">ORBIFLOW.</div>

        <div class="small-title">ACCOUNT RECOVERY</div>

        <h1>Forgot Your Password?</h1>

        <p class="description">
            Don't worry. Enter the email address associated with your
            OrbiFlow account. We'll send you a link to reset your password.
        </p>

        <form id="forgotPasswordForm">

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your registered email"
                required
            >

            <button type="submit" id="submitButton">
                Send Reset Link
            </button>

        </form>

        <div id="message"></div>

        <a href="{% url 'login-page' %}" class="back-link">
            ← Back to Login
        </a>

    </div>

    <script>
        document.getElementById("forgotPasswordForm").addEventListener("submit", async function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value;
            const button = document.getElementById("submitButton");
            const message = document.getElementById("message");

            button.disabled = true;
            button.textContent = "Sending...";
            message.textContent = "";

            try {

                const response = await fetch("{% url 'forgot-password' %}", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email
                    })
                });

                const data = await response.json();

                if (response.ok) {

                    message.style.color = "green";
                    message.textContent = data.message;

                } else {

                    message.style.color = "red";
                    message.textContent = "Something went wrong. Please try again.";

                }

            } catch (error) {

                message.style.color = "red";
                message.textContent = "Unable to connect. Please try again.";

            }

            button.disabled = false;
            button.textContent = "Send Reset Link";

        });
    </script>

</body>
</html>
