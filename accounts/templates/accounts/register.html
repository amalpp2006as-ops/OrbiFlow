{% extends 'base.html' %}

{% block title %}
Create Account | OrbiFlow
{% endblock %}

{% block content %}

<style>
    .register-section {
        background: #f5f2ed;
        padding: 70px 20px;
    }

    .register-card {
        max-width: 650px;
        margin: auto;
        background: #ffffff;
        padding: 45px;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
    }

    .register-label {
        color: #b58b63;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 2px;
        text-align: center;
        margin-bottom: 12px;
    }

    .register-card h2 {
        color: #22201d;
        font-size: 28px;
        font-weight: 600;
        text-align: center;
        margin-bottom: 10px;
    }

    .register-description {
        color: #85817b;
        font-size: 13px;
        text-align: center;
        margin-bottom: 30px;
    }

    .register-card label {
        display: block;
        color: #22201d;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 8px;
    }

    .register-card input,
    .register-card select {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #dedbd5;
        border-radius: 5px;
        outline: none;
        font-family: 'Poppins', sans-serif;
        font-size: 13px;
        margin-bottom: 20px;
        background: #ffffff;
    }

    .register-card input:focus,
    .register-card select:focus {
        border-color: #b58b63;
        box-shadow: none;
    }

    .register-card .form-row {
        display: flex;
        gap: 15px;
    }

    .register-card .form-row > div {
        flex: 1;
        min-width: 0;
    }

    .section-heading {
        color: #b58b63;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 1px;
        margin: 15px 0 18px;
        padding-bottom: 10px;
        border-bottom: 1px solid #eee9e2;
    }

    .register-btn {
        width: 100%;
        padding: 14px;
        background: #22201d;
        color: #ffffff;
        border: none;
        border-radius: 5px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 10px;
    }

    .register-btn:hover {
        background: #b58b63;
    }

    .register-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    #message {
        font-size: 13px;
        line-height: 1.7;
        margin-top: 18px;
    }

    #message ul {
        padding-left: 20px;
    }

    .login-link {
        text-align: center;
        margin-top: 25px;
        color: #85817b;
        font-size: 13px;
    }

    .login-link a {
        color: #b58b63;
        text-decoration: none;
        font-weight: 600;
    }

    @media (max-width: 576px) {
        .register-card {
            padding: 30px 22px;
        }

        .register-card .form-row {
            display: block;
        }
    }
</style>

<div class="register-section">

    <div class="register-card">

        <div class="register-label">
            JOIN ORBIFLOW
        </div>

        <h2>Create Your Account</h2>

        <p class="register-description">
            Create your OrbiFlow account and get started.
        </p>

        <form id="registerForm">


            <!-- PERSONAL DETAILS -->

            <div class="section-heading">
                PERSONAL INFORMATION
            </div>

            <div class="form-row">

                <div>
                    <label for="first_name">First Name</label>
                    <input type="text" id="first_name" required>
                </div>

                <div>
                    <label for="last_name">Last Name</label>
                    <input type="text" id="last_name" required>
                </div>

            </div>

            <label for="username">Username</label>
            <input type="text" id="username" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" required>

            <label for="phone">Phone Number</label>
            <input type="text" id="phone" required>


            <!-- COMPANY DETAILS -->

            <div id="companySection" style="display: none;">

                <div class="section-heading">
                    COMPANY INFORMATION
                </div>

                <label for="company_name">Company Name</label>
                <input type="text" id="company_name">

                <label for="company_phone">Company Phone</label>
                <input type="text" id="company_phone">

            </div>


            <!-- PASSWORD -->

            <div class="section-heading">
                ACCOUNT SECURITY
            </div>

            <label for="password">Password</label>
            <input type="password" id="password" required>

            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" required>


            <button type="submit" class="register-btn" id="registerButton">
                Create Account
            </button>

        </form>

        <div id="message"></div>

        <div class="login-link">
            Already have an account?
            <a href="{% url 'login-page' %}">Sign In</a>
        </div>

    </div>

</div>


<script>

    // SHOW COMPANY FIELDS FOR BUSINESS OWNER

    const accountType = document.getElementById("accountType");
    const companySection = document.getElementById("companySection");

    const companyName = document.getElementById("company_name");
    const companyPhone = document.getElementById("company_phone");

    accountType.addEventListener("change", function() {

        if (this.value === "owner") {

            companySection.style.display = "block";

            companyName.required = true;
            companyPhone.required = true;

        } else {

            companySection.style.display = "none";

            companyName.required = false;
            companyPhone.required = false;

            companyName.value = "";
            companyPhone.value = "";

        }

    });


    // REGISTER USER

    document.getElementById("registerForm").addEventListener("submit", async function(event) {

        event.preventDefault();

        const button = document.getElementById("registerButton");
        const message = document.getElementById("message");

        const type = accountType.value;

        if (!type) {
            message.style.color = "red";
            message.textContent = "Please select an account type.";
            return;
        }

        const data = {

            first_name: document.getElementById("first_name").value,
            last_name: document.getElementById("last_name").value,
            username: document.getElementById("username").value,
            email: document.getElementById("email").value,
            phone: document.getElementById("phone").value,
            password: document.getElementById("password").value,
            confirm_password: document.getElementById("confirm_password").value

        };

        let url;

        if (type === "owner") {

            data.company_name = companyName.value;
            data.company_phone = companyPhone.value;

            url = "{% url 'owner-register' %}";

        } else {

            url = "{% url 'customer-register' %}";

        }

        button.disabled = true;
        button.textContent = "Creating Account...";
        message.innerHTML = "";

        try {

            const response = await fetch(url, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(data)

            });

            const result = await response.json();

            if (response.ok) {

                message.style.color = "green";

                message.textContent = "Account created successfully! Redirecting to login...";

                document.getElementById("registerForm").reset();

                companySection.style.display = "none";

                setTimeout(function() {

                    window.location.href = "{% url 'login-page' %}";

                }, 2000);

            } else {

                message.style.color = "red";

                let errors = [];

                for (const field in result) {

                    if (Array.isArray(result[field])) {
                        errors.push(...result[field]);
                    } else {
                        errors.push(result[field]);
                    }

                }

                message.innerHTML = errors.map(error => {
                    const item = document.createElement("div");
                    item.textContent = error;
                    return item.outerHTML;
                }).join("");

            }

        } catch (error) {

            message.style.color = "red";
            message.textContent = "Unable to connect to the server. Please try again.";

        }

        button.disabled = false;
        button.textContent = "Create Account";

    });

</script>

{% endblock %}
