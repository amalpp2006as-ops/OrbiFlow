<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitation Expired | OrbiFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .message-box {
            max-width: 500px;
            margin: 100px auto;
            padding: 40px;
            background: white;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .logo {
            color: #c49a3a;
            font-size: 28px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="message-box">

    <div class="logo">OrbiFlow.</div>

    <h3 class="mt-4">Invitation Unavailable</h3>

    <p class="text-muted mt-3">
        This invitation has expired or has already been used.
        Please contact your company owner and request a new invitation.
    </p>

</div>

</body>
</html>
