<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify Email | OrbiFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .otp-box {
            max-width: 450px;
            margin: 100px auto;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .logo {
            color: #c49a3a;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
        }

        .subtitle {
            color: #777;
            text-align: center;
            margin: 15px 0 25px;
        }

        .otp-input {
            text-align: center;
            font-size: 24px;
            letter-spacing: 10px;
            padding: 12px;
        }

        .btn-gold {
            background: #c49a3a;
            color: white;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .btn-gold:hover {
            background: #a77e25;
            color: white;
        }
    </style>
</head>

<body>

<div class="otp-box">

    <div class="logo">OrbiFlow.</div>

    <h4 class="text-center mt-4">Verify Your Email</h4>

    <p class="subtitle">
        We've sent a 6-digit verification code to your email address.
        Enter the code below to complete your registration.
    </p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label class="form-label">Verification Code</label>

        <input
            type="text"
            name="otp"
            class="form-control otp-input mb-4"
            placeholder="000000"
            maxlength="6"
            pattern="[0-9]{6}"
            inputmode="numeric"
            autocomplete="one-time-code"
            required
        >

        <button type="submit" class="btn-gold">
            Verify & Create Account
        </button>

    </form>

</div>

</body>
</html>
